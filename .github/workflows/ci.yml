name: ci-cd
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: cd backend && pytest -q
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl -fsS http://localhost:8080/api/health
      - run: docker compose logs --no-color
        if: failure()
  publish:
    if: github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [backend, frontend] }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase registry name
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.REGISTRY }}/library-${{ matrix.service }}:${{ github.sha }}
      - name: Scan image for critical vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --exit-code 0 --ignore-unfixed ${{ env.REGISTRY }}/library-${{ matrix.service }}:${{ github.sha }}
      - run: |
          IMG=${{ env.REGISTRY }}/library-${{ matrix.service }}
          docker tag $IMG:${{ github.sha }} $IMG:latest
          docker push $IMG:${{ github.sha }} && docker push $IMG:latest
